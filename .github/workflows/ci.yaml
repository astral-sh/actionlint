name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local
  # renovate: datasource=go depName=honnef.co/go/tools
  STATICCHECK_VERSION: 'v0.7.0'
  # renovate: datasource=go depName=golang.org/x/vuln
  GOVULNCHECK_VERSION: 'v1.7.0'

defaults:
  run:
    shell: bash

jobs:
  unit-tests:
    name: Unit tests (${{ matrix.os }}, Go ${{ matrix.go }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
        go: ['1.25.14', '1.26.6']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        if: runner.os == 'Linux'
        with:
          version: '0.12.5'
          checksum: 68a509da24b06b4223a1c0175fb5eb5bc79342b76cbeff0cfe51ac3f5b17b6b2
          enable-cache: false
          activate-environment: true
      - name: Install external linters
        if: runner.os == 'Linux'
        run: |
          # Try the next configured mirror after the first failed download.
          cat /etc/apt/apt-mirrors.txt
          printf '%s\n' \
            'Acquire::Retries "0";' \
            'Acquire::http::Timeout "10";' \
            'Acquire::https::Timeout "10";' \
            | sudo tee /etc/apt/apt.conf.d/80-retries > /dev/null
          sudo apt-get update
          sudo apt-get install -y shellcheck
          uv sync --locked --no-build
      - run: go mod verify
      - run: go test -race ./...
      - name: Build without CGO
        run: go build -trimpath ./cmd/actionlint
        env:
          CGO_ENABLED: '0'
      - name: Check this repository's workflows
        run: ./actionlint -color

  wasm:
    name: Playground
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: playground
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.6'
          cache: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Build playground
        run: |
          bash ./post-install.bash
          GOOS=js GOARCH=wasm go build -trimpath -o main.wasm
          npm run build
      - run: npm run lint
      - run: npm test
      - run: npm audit --omit=dev

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.6'
          cache: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.12.5'
          checksum: 68a509da24b06b4223a1c0175fb5eb5bc79342b76cbeff0cfe51ac3f5b17b6b2
          enable-cache: false
          activate-environment: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Install linters
        run: |
          # Try the next configured mirror after the first failed download.
          cat /etc/apt/apt-mirrors.txt
          printf '%s\n' \
            'Acquire::Retries "0";' \
            'Acquire::http::Timeout "10";' \
            'Acquire::https::Timeout "10";' \
            | sudo tee /etc/apt/apt.conf.d/80-retries > /dev/null
          sudo apt-get update
          sudo apt-get install -y shellcheck
          uv sync --locked --no-build
          go install "honnef.co/go/tools/cmd/staticcheck@$STATICCHECK_VERSION"
          go install "golang.org/x/vuln/cmd/govulncheck@$GOVULNCHECK_VERSION"
      - name: Check formatting
        run: |
          diffs="$(gofmt -d ./*.go ./cmd/actionlint/*.go ./scripts/*/*.go ./playground/*.go)"
          if [[ -n "$diffs" ]]; then
            printf '%s\n' "$diffs" >&2
            exit 1
          fi
      - run: go vet ./...
      - run: staticcheck ./ ./scripts/... ./cmd/...
      - run: GOOS=js GOARCH=wasm staticcheck ./playground
      - run: govulncheck ./...
      - run: go run ./scripts/check-checks -quiet ./docs/checks.md
      - run: shellcheck ./scripts/*.bash ./playground/*.bash
      - name: Check problem matcher
        run: |
          make ./scripts/generate-actionlint-matcher/test/* SKIP_GO_GENERATE=true
          node ./scripts/generate-actionlint-matcher/test.mjs
          node ./scripts/generate-actionlint-matcher/main.mjs .github/actionlint-matcher.json
          git diff --exit-code -- .github/actionlint-matcher.json
